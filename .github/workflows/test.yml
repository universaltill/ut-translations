# Unit tests for the sync job, the Weblate provisioning script and the
# bundle publish tools. Public repo: GitHub-hosted runner, read-only token,
# no secrets (Weblate and the marketplace are fakes on 127.0.0.1).
#
# The bundle tests run universal-till's real compliance/naming guards and
# its real plugin installer + locale loader (ut-docs#4367), so the job
# checks out universal-till (public, no credential) at the commit this
# repo's English came from, and UTT_REQUIRE_TILL=1 turns a missing checkout
# into a failure instead of a skip.

name: test

on:
  push:
    branches: [main]
  pull_request:
  # The sync PR is opened with GITHUB_TOKEN, which starts no pull_request
  # run; sync-english dispatches this on its bot branch (ut-docs#4367).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Source commit
        id: src
        run: |
          set -euo pipefail
          commit=$(python3 -c 'import json; print(json.load(open("meta/source.json"))["main"]["commit"])')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::meta/source.json main.commit is not a sha"; exit 1; }
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: universal-till at source_commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: universaltill/universal-till
          ref: ${{ steps.src.outputs.commit }}
          path: till
          fetch-depth: 0
          persist-credentials: false

      # GitHub serves a fork's commit by sha: the tests run universal-till's
      # code, so the commit must be on its main or a vX.Y.Z tag's commit.
      - name: source_commit is on universal-till main
        env:
          COMMIT: ${{ steps.src.outputs.commit }}
        run: |
          set -euo pipefail
          commit="$COMMIT"
          git -C till fetch --quiet --tags origin +refs/heads/main:refs/remotes/origin/main
          if git -C till merge-base --is-ancestor "$commit" refs/remotes/origin/main; then exit 0; fi
          if git -C till tag --points-at "$commit" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then exit 0; fi
          echo "::error::source_commit $commit is not on universal-till main and no vX.Y.Z tag points at it"
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: till/go.mod
          cache-dependency-path: till/go.sum

      - name: Unit tests
        env:
          UTT_TILL_SOURCE: ${{ github.workspace }}/till
          UTT_REQUIRE_TILL: "1"
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v

  # Required check `paths` (ut-docs#4367, review MEDIUM-1): the sync job's
  # path gate runs once, on the runner, and a write user can push to the bot
  # branch afterwards. This repeats it server side over the whole PR range.
  # On every other branch it reports success at once (a required check that
  # is skipped never reports).
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Sync branch carries only sync-owned paths
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${HEAD_REF}" != "sync/english" ]; then
            echo "not the sync branch (${HEAD_REF}): nothing to check"
            exit 0
          fi
          git fetch --quiet origin main:refs/remotes/origin/main
          git show origin/main:meta/areas.json > "${RUNNER_TEMP}/areas.json"
          base=$(git merge-base origin/main HEAD)
          git diff --raw -z --no-renames "${base}..HEAD" \
            | python3 tools/sync_english.py --check-paths --raw --areas-file "${RUNNER_TEMP}/areas.json"
