# Every commit on a PR must be authored by the human who did the work
# (ut-docs#732, #1373; copied from universal-till). Public repo: GitHub-hosted
# runner only — a fork PR must never run inside the homelab.
#
# The sync job's github-actions[bot] commits reach main through a PR whose
# checks are dispatched (below); the bot address is accepted only on that
# dispatch run, never on a pull_request run. No Weblate push to main exists
# yet (no deploy key); if one is added it must not go through this guard's
# bot allowance.

name: commit-attribution

on:
  pull_request:
  # Dispatched by sync-english on its bot branch (a GITHUB_TOKEN PR starts no
  # pull_request run, ut-docs#4367). Range = origin/main..HEAD of that branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run guard-commit-attribution regression tests
        run: bash scripts/ci/guard-commit-attribution_test.sh

      - name: Reject AI-tool, unattributable, or wrong-ID noreply commit authors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The sync bot's commits are accepted only on a dispatch run; on a
          # pull_request a human could author a commit as the bot address.
          ALLOW_ACTIONS_BOT: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            BASE_SHA=$(git rev-parse origin/main)
            HEAD_SHA=$(git rev-parse HEAD)
          fi
          git log --format='%H|%ae|%an' "$BASE_SHA..$HEAD_SHA" | bash scripts/ci/guard-commit-attribution.sh
